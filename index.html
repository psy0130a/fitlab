<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FitLab">
<meta name="theme-color" content="#b03a2e">
<meta http-equiv="refresh" content="0; url=fitlab.html">
<link rel="manifest" href="fitlab-manifest.json">
<title>FitLab</title>
<style>
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  background:#faf8f3; color:#1f1d1a;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:100vh; padding:24px;
  text-align:center;
}
.logo{font-size:14px; letter-spacing:4px; color:#b03a2e; font-weight:700; margin-bottom:10px;}
h1{font-size:22px; margin-bottom:8px;}
.muted{color:#8a857a; font-size:13.5px; margin-bottom:24px;}
a{color:#b03a2e; text-decoration:none; font-weight:600;}
.spinner{
  width:32px; height:32px; border:3px solid #e8e3d8; border-top-color:#b03a2e;
  border-radius:50%; animation:spin 0.8s linear infinite; margin:8px 0 18px;
}
@keyframes spin{ to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="logo">FITLAB</div>
  <h1>启动中…</h1>
  <div class="spinner"></div>
  <div class="muted">正在打开 FitLab App</div>
  <p style="font-size:12px; margin-top:18px; color:#8a857a;">
    没有自动跳转?<br>
    <a href="fitlab.html">点这里进入 App →</a><br>
    <a href="docs.html" style="color:#8a857a; font-weight:400;">查看项目文档</a>
  </p>
<script>
// 比 meta refresh 更快的 JS 跳转，避免任何残留 history 干扰返回键
window.location.replace('fitlab.html');
</script>
</body>
</html>
