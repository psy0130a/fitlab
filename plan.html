<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FitLab Plan">
<meta name="theme-color" content="#b03a2e">
<title>FitLab · 我的训练计划</title>
<style>
:root{
  --bg:#faf8f3; --paper:#fff; --paper-2:#fdfaf2;
  --ink:#1f1d1a; --ink-2:#4a463f; --muted:#8a857a;
  --line:#e8e3d8; --line-2:#d6cfbe;
  --accent:#b03a2e; --accent-light:#fbe7e1;
  --gold:#c08a2e; --soft-yellow:#fff8e3; --soft-blue:#eef3f8; --good:#2d6e3a;
  --p1:#2f5d8d; --p2:#b03a2e; --p3:#c08a2e; --p4:#5a7f5a;
}
*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
body{
  background:var(--bg); color:var(--ink); line-height:1.75; font-size:15px;
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;
  padding:24px 14px calc(40px + env(safe-area-inset-bottom));
}
.wrap{max-width:820px; margin:0 auto;}

/* 顶部返回 */
.topnav{display:flex; gap:10px; align-items:center; margin-bottom:14px;}
.topnav a{color:var(--muted); text-decoration:none; font-size:13px;}
.topnav a:hover{color:var(--accent);}
.topnav .spacer{flex:1;}

/* 头部 */
header{text-align:center; padding:18px 16px 14px;}
header .tag{font-size:11px; letter-spacing:.32em; color:var(--accent); font-weight:700;}
header h1{font-size:26px; margin:6px 0 4px; letter-spacing:.5px;}
header .sub{font-size:13.5px; color:var(--muted);}

/* 卡片基础 */
section{
  background:var(--paper); border:1px solid var(--line); border-radius:14px;
  padding:22px 22px; margin-bottom:16px;
}
section h2{font-size:18.5px; color:var(--accent); margin-bottom:10px; letter-spacing:.3px;}
section h3{
  font-size:15px; margin:18px 0 8px; border-left:3px solid var(--accent);
  padding-left:10px; color:var(--ink);
}
section h4{font-size:14px; margin:14px 0 6px; color:var(--ink);}
p{margin:6px 0; color:var(--ink-2); font-size:14px;}
section ul, section ol{margin:6px 0 6px 22px; color:var(--ink-2); font-size:14px;}
section li{margin:3px 0;}
b{color:var(--ink);}

/* 摘要框 */
.summary-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:10px;
  margin:12px 0 6px;
}
@media (max-width:480px){
  .summary-grid{grid-template-columns:1fr;}
}
.summary-cell{
  background:var(--paper-2); border-radius:10px; padding:11px 14px;
  border-left:3px solid var(--accent);
}
.summary-cell .k{font-size:11.5px; color:var(--muted); letter-spacing:.5px;}
.summary-cell .v{font-size:16px; color:var(--ink); font-weight:600; margin-top:2px;}

/* 表格 */
table{width:100%; border-collapse:collapse; margin:8px 0; font-size:13.5px;}
th,td{text-align:left; padding:8px 10px; vertical-align:top; border-bottom:1px solid var(--line);}
th{background:var(--paper-2); color:var(--ink-2); font-size:12px; font-weight:600;}
td.num{font-variant-numeric:tabular-nums; white-space:nowrap;}

/* 阶段卡片 */
.phases{display:flex; flex-direction:column; gap:10px; margin-top:10px;}
.phase{
  background:var(--paper-2); border-radius:10px; padding:14px 16px;
  border-left:4px solid var(--p1);
}
.phase.p1{border-color:var(--p1);}
.phase.p2{border-color:var(--p2);}
.phase.p3{border-color:var(--p3);}
.phase.p4{border-color:var(--p4);}
.phase .head{display:flex; align-items:baseline; gap:8px; margin-bottom:6px;}
.phase .head .name{font-weight:700; color:var(--ink); font-size:15px;}
.phase .head .weeks{font-size:12px; color:var(--muted);}
.phase .focus{font-size:13px; color:var(--ink-2); margin-bottom:8px;}
.phase .prescription{font-size:13px; color:var(--ink-2); line-height:1.85;}
.phase .prescription .item{display:flex; gap:6px;}
.phase .prescription .item .k{color:var(--muted); min-width:80px;}
.phase .prescription .item .v{color:var(--ink); font-weight:500; flex:1;}

/* 课型 + 动作表 */
.session-card{
  margin-bottom:14px; background:var(--paper-2); border-radius:10px;
  padding:14px 16px; border-left:4px solid var(--accent);
}
.session-card .head{display:flex; align-items:baseline; gap:8px; margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid var(--line);}
.session-card .badge{
  display:inline-block; background:var(--accent); color:#fff;
  padding:2px 10px; border-radius:6px; font-size:12px; font-weight:700;
}
.session-card .name{font-size:16px; color:var(--ink); font-weight:700;}
.session-card .focus{font-size:12.5px; color:var(--muted); margin-bottom:8px;}
.exercise-table{font-size:13px;}
.exercise-table th{font-size:11.5px;}
.exercise-row .name{font-weight:600; color:var(--ink);}
.exercise-row .muscles{font-size:11.5px; color:var(--muted); margin-top:1px;}
.exercise-row .compound-pill{
  display:inline-block; font-size:10px; padding:1px 6px; border-radius:6px;
  background:var(--accent-light); color:var(--accent); margin-left:4px; font-weight:600;
}
.exercise-row .iso-pill{
  background:var(--soft-blue); color:var(--ink-2);
}
.exercise-row .load{font-weight:600; color:var(--ink);}
.exercise-row .load-warning{color:var(--accent); font-weight:600; font-size:11.5px;}

/* 引用块 */
.callout{
  background:var(--soft-yellow); border:1px solid #f0e2b8; border-radius:8px;
  padding:13px 16px; margin:10px 0; color:#7a5a1f; font-size:13.5px; line-height:1.85;
}
.callout.green{background:#e3f1e6; border-color:#bcdcc4; color:#2a4a30;}
.callout.blue{background:var(--soft-blue); border-color:#c5d4e3; color:var(--ink-2);}
.callout.red{background:var(--accent-light); border-color:var(--accent); color:var(--accent);}
.callout b{color:inherit;}

/* 折叠原理 */
details{margin:8px 0;}
details summary{
  color:var(--accent); cursor:pointer; font-weight:500; padding:6px 0;
  list-style:none; font-size:13.5px;
}
details summary::before{content:'ⓘ '; font-style:normal;}
details[open] summary{margin-bottom:6px;}
details .body{padding:8px 12px; background:var(--paper-2); border-radius:6px; border-left:3px solid var(--accent); color:var(--ink-2); font-size:13px; line-height:1.85;}

/* 错误页 */
.error-state{
  text-align:center; padding:60px 22px;
}
.error-state .emoji{font-size:48px; display:block; margin-bottom:14px;}
.error-state h2{font-size:20px; margin-bottom:8px;}
.error-state p{font-size:14px; color:var(--muted); margin-bottom:18px;}
.error-state .btn{
  display:inline-block; padding:12px 22px; background:var(--accent); color:#fff;
  text-decoration:none; border-radius:9px; font-weight:600;
}

/* 底部 CTA */
.cta-row{
  display:flex; gap:10px; flex-wrap:wrap; padding-top:10px;
}
.cta-row a{
  flex:1; min-width:160px; text-align:center; padding:14px;
  border-radius:10px; text-decoration:none; font-weight:600;
}
.cta-row a.primary{background:var(--accent); color:#fff;}
.cta-row a.secondary{background:var(--paper); color:var(--ink-2); border:1px solid var(--line);}
footer{text-align:center; font-size:11.5px; color:var(--muted); margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">

<nav class="topnav">
  <a href="index.html">← 返回首页</a>
  <div class="spacer"></div>
  <a href="onboarding.html">重新答 onboarding</a>
</nav>

<main id="main"></main>

</div>

<script src="fitlab-data.js"></script>
<script src="plan-engine.js"></script>
<script>
const STORAGE_KEY = 'fitlab_v1';

function loadOnboarding(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    const obj = raw ? JSON.parse(raw) : {};
    return obj.onboarding || null;
  }catch(e){return null;}
}

function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({['&']:'&amp;',['<']:'&lt;',['>']:'&gt;',['"']:'&quot;',["'"]:'&#39;'})[c]);}

function muscleName(m){
  const map = {
    'quadriceps':'股四头', 'glutes':'臀大', 'hamstrings':'腘绳', 'erector':'竖脊', 'adductors':'内收',
    'core':'核心', 'upper-back':'上背', 'chest':'胸大', 'chest-upper':'上胸',
    'delt-front':'三角肌前束','delt-mid':'三角肌中束','delt-rear':'三角肌后束',
    'triceps':'三头','biceps':'二头','forearms':'前臂',
    'back-lat':'背阔','back-rhomboid':'菱形','rotator-cuff':'肩袖',
    'glute-med':'臀中','abs':'腹直','obliques':'腹斜',
    'calves':'小腿','hip-flexors':'髋屈',
  };
  return map[m] || m;
}

function renderError(msg){
  return `
    <div class="error-state">
      <span class="emoji">📋</span>
      <h2>${escapeHtml(msg)}</h2>
      <p>先完成 onboarding 才能生成你的计划。</p>
      <a class="btn" href="onboarding.html">开始 onboarding →</a>
    </div>
  `;
}

function renderBoundary(rec){
  return `
    <header>
      <div class="tag">FITLAB · 计划生成</div>
      <h1>需要先建立动作基础</h1>
      <p class="sub">根据你的回答，我们没法直接给你训练计划</p>
    </header>
    <section class="callout" style="margin-bottom:14px;">
      <p><b>系统判定 ⇒ ${escapeHtml(rec.experience.reason)}</b></p>
    </section>
    <section>
      <h2>建议路径</h2>
      <ol>
        <li>线下专业场馆上 <b>5-10 节私教课</b>，把杠铃 5 大动作（蹲/硬拉/卧推/推举/划船 + 引体）的动作模式学下来</li>
        <li>YouTube 上看 <b>Squat University / Athlean-X / Jeff Nippard</b> 的动作教学视频</li>
        <li>等能"独立完成 + 知道哪里发力"，回来重做 onboarding</li>
      </ol>
    </section>
    <div class="cta-row">
      <a class="primary" href="onboarding.html">重新评估</a>
      <a class="secondary" href="index.html">返回首页</a>
    </div>
  `;
}

function buildPlanPage(rec, plan){
  return `
    <header>
      <div class="tag">FITLAB · 我的训练计划</div>
      <h1>${escapeHtml(rec.goal.name)} · ${escapeHtml(window.FITLAB_ENGINE.levelName(rec.experience.level))}</h1>
      <p class="sub">基于你的 input 由训练科学规则生成 · 每个推荐都可展开看原理</p>
    </header>

    ${renderSummary(rec, plan)}
    ${renderRecommendationDetails(rec)}
    ${renderMesocyclePhases(rec.mesocycle)}
    ${renderSessions(plan)}
    ${renderStartingLoadNote(plan)}
    ${renderProgressionRules(rec)}
    ${renderClosing()}
  `;
}

function renderSummary(rec, plan){
  const conflictNote = rec.frequency.conflict_note;
  return `
    <section>
      <h2>1. 你的计划概览</h2>
      <div class="summary-grid">
        <div class="summary-cell"><div class="k">目标</div><div class="v">${escapeHtml(rec.goal.name)}</div></div>
        <div class="summary-cell"><div class="k">经验等级</div><div class="v">${escapeHtml(window.FITLAB_ENGINE.levelName(rec.experience.level))}</div></div>
        <div class="summary-cell"><div class="k">推荐频率</div><div class="v">${escapeHtml(rec.frequency.times_per_week)} 次/周</div></div>
        <div class="summary-cell"><div class="k">周期长度</div><div class="v">${rec.mesocycle.is_indefinite ? '无限循环' : escapeHtml(rec.mesocycle.total_weeks)+' 周'}</div></div>
        <div class="summary-cell"><div class="k">课型分化</div><div class="v" style="font-size:14.5px;">${escapeHtml(rec.split.name)}</div></div>
        <div class="summary-cell"><div class="k">总课次</div><div class="v" style="font-size:14.5px;">${escapeHtml(plan.summary.total_sessions)}</div></div>
      </div>
      ${conflictNote ? `<div class="callout" style="margin-top:10px;">${escapeHtml(conflictNote)}</div>` : ''}
    </section>
  `;
}

function renderRecommendationDetails(rec){
  return `
    <section>
      <h2>2. 推荐的依据（每条都可展开看原理）</h2>

      <h3>2.1 经验等级判定 = ${escapeHtml(window.FITLAB_ENGINE.levelName(rec.experience.level))}</h3>
      <p>${escapeHtml(rec.experience.reason)}</p>

      <h3>2.2 推荐频率 = ${escapeHtml(rec.frequency.times_per_week)} 次/周</h3>
      <p><b>原理范围</b>：${escapeHtml(rec.frequency.optimal_range)}</p>
      <details>
        <summary>看完整理由</summary>
        <div class="body">${escapeHtml(rec.frequency.reason)}</div>
      </details>

      <h3>2.3 推荐周期 = ${rec.mesocycle.is_indefinite ? '无限循环' : escapeHtml(rec.mesocycle.total_weeks)+' 周'}</h3>
      <p><b>名称</b>：${escapeHtml(rec.mesocycle.name)}</p>
      <details>
        <summary>看完整理由</summary>
        <div class="body">${escapeHtml(rec.mesocycle.rationale)}</div>
      </details>

      <h3>2.4 推荐课型分化 = ${escapeHtml(rec.split.name)}</h3>
      <details>
        <summary>看完整理由</summary>
        <div class="body">${escapeHtml(rec.split.rationale)}</div>
      </details>
    </section>
  `;
}

function renderMesocyclePhases(mesocycle){
  if(mesocycle.is_indefinite){
    const p = mesocycle.phases[0];
    return `
      <section>
        <h2>3. 训练节奏（无限循环）</h2>
        <p>维持目标没有 mesocycle 概念，每次训练保持下面的处方：</p>
        <div class="phases">
          <div class="phase p4">
            <div class="head"><span class="name">${escapeHtml(p.name)}</span></div>
            ${renderPrescription(p.prescription)}
          </div>
        </div>
      </section>
    `;
  }

  const colors = ['p1','p2','p3','p4'];
  return `
    <section>
      <h2>3. 周期阶段（共 ${mesocycle.total_weeks} 周）</h2>
      <p>每阶段的训练量/强度处方按训练学渐进规律设计。表格里的具体动作和起步重量在下一节展开。</p>
      <div class="phases">
        ${mesocycle.phases.map((ph, i) => `
          <div class="phase ${colors[i % 4]}">
            <div class="head">
              <span class="name">${escapeHtml(ph.name)}</span>
              <span class="weeks">第 ${Array.isArray(ph.weeks) ? ph.weeks.join('、') : ph.weeks} 周</span>
            </div>
            <div class="focus">${escapeHtml(ph.focus || '')}</div>
            ${renderPrescription(ph.prescription)}
          </div>
        `).join('')}
      </div>
    </section>
  `;
}

function renderPrescription(pr){
  const items = [];
  if(pr.sets_per_main !== undefined) items.push(['每主动作组数', pr.sets_per_main]);
  if(pr.sets_per_isolation !== undefined && pr.sets_per_isolation > 0) items.push(['每孤立动作组数', pr.sets_per_isolation]);
  if(pr.reps_main) items.push(['主动作次数', pr.reps_main]);
  if(pr.reps_isolation) items.push(['孤立动作次数', pr.reps_isolation]);
  if(pr.rir) items.push(['RIR（余力次数）', pr.rir]);
  if(pr.rest_main_sec) items.push(['主动作间歇', pr.rest_main_sec + ' 秒']);
  if(pr.rest_isolation_sec) items.push(['孤立动作间歇', pr.rest_isolation_sec + ' 秒']);
  if(pr.load_pct_of_previous) items.push(['负荷调整', '上次的 ' + pr.load_pct_of_previous]);
  if(pr.progression) items.push(['进阶规则', pr.progression]);

  return `
    <div class="prescription">
      ${items.map(([k,v]) => `<div class="item"><div class="k">${escapeHtml(k)}</div><div class="v">${escapeHtml(v)}</div></div>`).join('')}
    </div>
  `;
}

function renderSessions(plan){
  return `
    <section>
      <h2>4. 每周课型 · 动作 · 起步重量</h2>
      <p>每节课的动作由系统按"<b>动作模式 + 肌群覆盖 + 你的伤病/器械限制</b>"从动作池里选出，避开了你勾选的不适部位。</p>
      <p><b>起步重量是参考</b>——按你的性别、体重、经验等级查 StrengthLevel 统计数据反推（取 1RM 的 60-65%）。第 1 周按 RIR 3-4 自己校准，实测的重量记进手册当作你这台手机上的"真基线"。</p>

      ${plan.sessions.map(s => `
        <div class="session-card">
          <div class="head">
            <span class="badge">课型 ${escapeHtml(s.id)}</span>
            <span class="name">${escapeHtml(s.name)}</span>
          </div>
          ${s.focus ? `<div class="focus">${escapeHtml(s.focus)}</div>` : ''}
          <table class="exercise-table">
            <thead><tr>
              <th style="width:38%">动作</th>
              <th>主训肌群</th>
              <th style="width:24%">起步重量参考</th>
            </tr></thead>
            <tbody>
              ${s.slots.map(slot => {
                if(!slot.exercise){
                  return `<tr class="exercise-row"><td colspan="3"><span class="load-warning">${escapeHtml(slot.note||'无可用动作（伤病/器械限制）')}</span></td></tr>`;
                }
                const ex = slot.exercise;
                const muscles = (ex.primary || []).map(muscleName).join('・');
                const synergists = (ex.synergist || []).slice(0,2).map(muscleName).join('・');
                const compoundPill = ex.is_compound
                  ? `<span class="compound-pill">复合</span>`
                  : `<span class="compound-pill iso-pill">孤立</span>`;
                return `
                  <tr class="exercise-row">
                    <td>
                      <div class="name">${escapeHtml(ex.name)}${compoundPill}</div>
                    </td>
                    <td>
                      <div style="font-size:12.5px;">${escapeHtml(muscles)}</div>
                      ${synergists ? `<div class="muscles">协同：${escapeHtml(synergists)}</div>` : ''}
                    </td>
                    <td><div class="load">${escapeHtml(slot.start_load?.display || '按 RIR 校准')}</div></td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `).join('')}
    </section>
  `;
}

function renderStartingLoadNote(plan){
  return `
    <section>
      <h2>5. 起步重量怎么用 · 重要</h2>
      <div class="callout green">
        <p><b>起步重量是参考，不是命令。</b></p>
        <ol>
          <li>第 1 次做每个动作，按"<b>能干净完成 + 还留 3-4 次余力（RIR 3-4）</b>"来微调</li>
          <li>比参考值轻或重都正常。每个人的杠杆、技术、力量水平不同</li>
          <li><b>把实际用的重量记进动作手册</b>，那才是你真正的基线</li>
          <li>后面所有进阶规则（每周 +2.5kg / +1-2 次）从这个真基线往上走</li>
        </ol>
      </div>
      <p><b>数据来源说明</b>：起步重量的"参考"取自 <a href="https://strengthlevel.com" target="_blank" style="color:var(--accent);">StrengthLevel.com</a> 等公开统计（基于数百万用户上报的 1RM），按你性别 × 体重 × 经验等级查表，取 1RM 的 60-65% 作为阶段一的起步负荷。后续 v2 会做更精准的版本。</p>
    </section>
  `;
}

function renderProgressionRules(rec){
  const goal = rec.goal.id;
  const tips = {
    'hypertrophy': [
      '主复合动作每周 +2.5kg <b>或</b> +1-2 次次数（哪个更稳定就先加哪个）',
      '能干净做完次数上限（如 6-12 中的 12 次），下次加 2.5kg',
      '加不动重量、做不到次数上限，<b>保持原重量把组做满</b>，下周再尝试加',
      '连续 2 周完全没进步 ⇒ 检查睡眠/营养/压力；考虑提前进入减载',
    ],
    'strength': [
      '每次训练给主动作 +2.5kg（新手）/ 每周 +2.5kg（中级）',
      '加不上去 ⇒ 减少负重 10%，重做 2-3 周再尝试',
      '强度日做不动 1RM 的 85%+ ⇒ 进入减载',
    ],
    'cutting': [
      '<b>强度优先</b>。能掉训练量不掉强度：先掉组数（3→2），再掉次数，最后才掉重量',
      '体重下降速度 0.5-1% 体重/周 = 健康赤字',
      '一周训练量掉了 30% 但身材改善依然 ⇒ 算成功',
    ],
    'maintenance': [
      '保持当前重量。不强求进步',
      '感到疲劳/没动力 ⇒ 直接减组数',
      '需要恢复进步 ⇒ 切换到"增肌"目标重做 onboarding',
    ],
  }[goal] || [];

  return `
    <section>
      <h2>6. 进阶规则（每周怎么加）</h2>
      <ul>
        ${tips.map(t => `<li>${t}</li>`).join('')}
      </ul>
    </section>
  `;
}

function renderClosing(){
  return `
    <section class="callout blue">
      <p><b>下一步</b>：用「动作手册手机版」记录每节课的实际重量/次数/RIR。第一个 mesocycle 结束（${escapeHtml(window.FITLAB_ENGINE.levelName('intermediate'))}增肌通常 10 周）后回来重新评估——基于这次的真实数据，下一个计划会更贴你。</p>
    </section>
    <div class="cta-row">
      <a class="primary" href="fitlab.html">去 FitLab App 开始训练 →</a>
      <a class="secondary" href="onboarding.html">重新答 onboarding</a>
      <a class="secondary" href="index.html">返回首页</a>
    </div>
    <footer>FitLab · 数据驱动的训练规划工具</footer>
  `;
}

/* ============= 启动 ============= */
function main(){
  const onboarding = loadOnboarding();
  const root = document.getElementById('main');

  if(!onboarding || !onboarding.answers){
    root.innerHTML = renderError('还没有 onboarding 数据');
    return;
  }

  // 实时跑一次推荐和生成（保证用最新逻辑）
  const recommendation = window.FITLAB_ENGINE.computeRecommendation(onboarding.answers);

  if(recommendation.is_boundary){
    root.innerHTML = renderBoundary(recommendation);
    return;
  }

  const plan = window.FITLAB_ENGINE.generatePlan(recommendation);
  if(!plan){
    root.innerHTML = renderError('计划生成失败');
    return;
  }

  root.innerHTML = buildPlanPage(recommendation, plan);
  document.title = `FitLab · ${recommendation.goal.name} · ${window.FITLAB_ENGINE.levelName(recommendation.experience.level)}`;
}

main();
</script>
</body>
</html>
